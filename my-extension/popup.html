<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaiko Lottery Helper</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-width: 280px;
      margin: 0;
      color: #172033;
      background: #f5f7fb;
    }

    button, textarea, input { font: inherit; }

    .panel {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 20px;
    }

    .mark {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      color: #ffffff;
      background: #1769e0;
      font-size: 17px;
      font-weight: 750;
    }

    .title {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }

    .subtitle {
      margin-top: 3px;
      color: #677083;
      font-size: 12px;
      line-height: 1.4;
    }

    .section {
      padding: 16px;
      border: 1px solid #dde3ed;
      border-radius: 8px;
      background: #ffffff;
    }

    .section + .section { margin-top: 14px; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .label, .section-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .section-title { margin: 0; }

    .hint {
      margin: 4px 0 0;
      color: #697386;
      font-size: 12px;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 6px 8px;
      border-radius: 999px;
      color: #6b7280;
      background: #eef1f6;
      font-size: 12px;
      font-weight: 700;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .status.active {
      color: #0f766e;
      background: #dff7ef;
    }

    .status.inactive {
      color: #6b7280;
      background: #eef1f6;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex: 0 0 auto;
    }

    .switch input {
      width: 0;
      height: 0;
      opacity: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background-color: #cfd6e3;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .slider::before {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(23, 32, 51, 0.25);
      content: "";
      transition: transform 0.2s;
    }

    input:checked + .slider {
      background-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.14);
    }

    input:checked + .slider::before { transform: translateX(20px); }

    input:focus-visible + .slider,
    textarea:focus-visible,
    button:focus-visible {
      outline: 2px solid #1769e0;
      outline-offset: 2px;
    }

    .url-input {
      width: 100%;
      min-height: 176px;
      margin-top: 12px;
      padding: 11px 12px;
      resize: vertical;
      border: 1px solid #cfd6e3;
      border-radius: 6px;
      color: #172033;
      background: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    .url-input::placeholder { color: #929bad; }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .start-button {
      min-height: 40px;
      flex: 1 1 auto;
      padding: 9px 14px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: #1769e0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .start-button:hover:not(:disabled) { background: #0f5cc9; }

    .start-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .interval {
      flex: 0 0 auto;
      color: #697386;
      font-size: 12px;
      white-space: nowrap;
    }

    .queue-status {
      min-height: 20px;
      margin: 10px 0 0;
      color: #697386;
      font-size: 12px;
      line-height: 1.5;
    }

    .queue-status.error { color: #b42318; }
    .queue-status.success { color: #0f766e; }
  </style>
</head>
<body>
  <main class="panel">
    <header class="top">
      <div class="mark" aria-hidden="true">Z</div>
      <div>
        <h1 class="title">Zaiko Helper</h1>
        <div class="subtitle">抽选页面操作与链接队列</div>
      </div>
    </header>

    <section class="section" aria-labelledby="automationTitle">
      <div class="row">
        <div>
          <div id="automationTitle" class="label">自动执行</div>
          <p class="hint">开启后，匹配页面加载时运行</p>
        </div>
        <label class="switch" aria-label="切换自动执行">
          <input id="enabledToggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      <div id="status" class="status inactive">读取中</div>
    </section>

    <section class="section" aria-labelledby="urlQueueTitle">
      <h2 id="urlQueueTitle" class="section-title">依次打开公演链接</h2>
      <p class="hint">每行输入一个完整 URL。链接会在后台标签页中依次打开。</p>
      <textarea
        id="urlInput"
        class="url-input"
        aria-describedby="queueStatus"
        spellcheck="false"
        placeholder="https://akb48.zaiko.io/ja/e/example-1&#10;https://akb48.zaiko.io/ja/e/example-2"
      ></textarea>
      <div class="actions">
        <button id="startButton" class="start-button" type="button">开始打开以下 URL</button>
        <span class="interval">间隔 5 秒</span>
      </div>
      <p id="queueStatus" class="queue-status" role="status" aria-live="polite">尚未开始</p>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
